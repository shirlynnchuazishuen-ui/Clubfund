
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Expense - ClubFund</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js" defer></script>
    <script src="expense.js" defer></script>
</head>
<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h1 class="sidebar-logo">ClubFund</h1>

            <nav class="sidebar-nav">
                <a href="dashboard.html" id="dashboardNavLink">
                    Dashboard
                </a>

                <a href="income.html" id="incomeNavLink" style="display: none;">
                    Income
                </a>

                <a href="expense.html" class="active">
                    Submit New Expense
                </a>

                <a href="budget.html">
                    Budgets
                </a>
            </nav>

            <div class="sidebar-bottom">
                <button id="logoutButton">Logout</button>
                <p id="logoutMessage"></p>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <header class="page-header">
                <h2>Submit Expense</h2>
                <p>Submit your expense claim and upload the receipt.</p>
            </header>

            <section class="content-section">

                <form id="expenseForm">

                    <div class="form-group">
                        <label for="expenseAmount">Expense Amount (RM)</label>
                        <input type="number" id="expenseAmount"
                            placeholder="Enter amount">
                    </div>

                    <div class="form-group">
                        <label for="expenseDescription">Description</label>
                        <input type="text" id="expenseDescription"
                            placeholder="Enter expense description">
                    </div>

                    <div class="form-group">
                        <label for="expenseCategory">Category</label>
                        <select id="expenseCategory">
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Equipment">Equipment</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expenseBudget">Budget</label>
                        <select id="expenseBudget" required>
                            <option value="">Select budget</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expenseDate">Expense Date</label>
                        <input type="date" id="expenseDate">
                    </div>

                    <div class="form-group">
                        <label for="receipt">Receipt</label>
                        <input type="file" id="receipt">
                    </div>

                    <button type="submit">Submit Expense</button>

                    <p id="expenseMessage"></p>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
