
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ClubFund</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js" defer></script>
    <script src="dashboard.js" defer></script>
</head>
<body>

    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h1 class="sidebar-logo">ClubFund</h1>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active">
                    Dashboard
                </a>

                <a href="expense.html">
                    Submit New Expense
                </a>

                <a href="budget.html">
                    Budgets
                </a>
            </nav>

            <div class="sidebar-bottom">
                <button id="logoutButton">Logout</button>
                <p id="logoutMessage"></p>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <header class="page-header">
                <div>
                    <h2>Dashboard</h2>
                    <p>Welcome to ClubFund!</p>
                </div>
            </header>

            <section class="content-section">

                <h2>Expense Records</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th>Amount (RM)</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="expenseRecords">
                        <tr>
                            <td colspan="5">Loading expenses...</td>
                        </tr>
                    </tbody>
                </table>

                <p id="expenseRecordsMessage"></p>

            </section>

        </main>

    </div>

</body>
</html>
