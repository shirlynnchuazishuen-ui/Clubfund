<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasurer Dashboard - ClubFund</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js" defer></script>
    <script src="treasurer.js" defer></script>
</head>

<body>

    <div class="app-layout">
        
        <!-- Sidebar -->
        <aside class="sidebar">

            <h1 class="sidebar-logo">ClubFund</h1>

            <nav class="sidebar-nav">
                <a href="treasurer.html" class="active">Dashboard</a>

                <a href="income.html">Income</a>

                <a href="expense.html">Submit New Expense</a>

                <a href="budget.html">Budgets</a>
            </nav>

            <div class="sidebar-bottom">
                <button id="logoutButton">Logout</button>
            </div>

</aside>

        <!-- Main Content -->
        <main class="main-content">

            <header class="page-header">
                <h2>Treasurer Dashboard</h2>
                <p>Review and manage expense claims.</p>
            </header>


            <!-- Club Financial Overview -->
            <section class="financial-overview">

                <div class="balance-card">
                    <p>Club Balance</p>
                    <h2 id="clubBalance">RM 0.00</h2>
                </div>

                <div class="summary-card">
                    <p>Total Income</p>
                    <h2 id="totalIncome">RM 0.00</h2>
                </div>

                <div class="summary-card">
                    <p>Total Expenses</p>
                    <h2 id="totalExpenses">RM 0.00</h2>
                </div>

            </section>


            <section class="content-section">

                <h2>Expense Claims</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Member</th>
                            <th>Description</th>
                            <th>Amount (RM)</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Receipt</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseRecords">
                        <tr>
                            <td colspan="8">Loading expenses...</td>
                        </tr>
                    </tbody>
                </table>

            </section>

            <p id="message"></p>

        </main>

    </div>

</body>
</html>
