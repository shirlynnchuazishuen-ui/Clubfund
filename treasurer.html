<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasurer Dashboard - ClubFund</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js" defer></script>
    <script src="treasurer.js" defer></script>
</head>

<body>

    <div class="dashboard">

        <h1>ClubFund</h1>
        <h2>Treasurer Dashboard</h2>

        <button id="logoutButton">Logout</button>
        <p id="message"></p>

        <hr>

        <h2>Expense Claims</h2>

        <table>
            <thead>
                <tr>
                    <th>Member</th>
                    <th>Description</th>
                    <th>Amount (RM)</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Receipt</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseRecords">
                <tr>
                    <td colspan="8">Loading expenses...</td>
                </tr>
            </tbody>
        </table>

        <hr>

        <a href="budget.html">Manage Budgets</a>

    </div>

</body>
</html>
