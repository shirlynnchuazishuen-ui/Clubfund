<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Management - ClubFund</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js" defer></script>
    <script src="budget.js" defer></script>
</head>
<body>

    <div class="app-layout">

        <!-- Sidebar -->
       <aside class="sidebar">

    <h1 class="sidebar-logo">ClubFund</h1>

    <nav class="sidebar-nav">
        <a href="dashboard.html" id="dashboardNavLink">Dashboard</a>

        <a href="income.html" id="incomeNavLink" style="display: none;">
            Income
        </a>

        <a href="expense.html">Submit New Expense</a>

        <a href="budget.html" class="active">Budgets</a>
    </nav>

    <div class="sidebar-bottom">
        <button id="logoutButton">Logout</button>
        <p id="logoutMessage"></p>
    </div>

</aside>

        <!-- Main Content -->
        <main class="main-content">

            <header class="page-header">
                <h2 id="pageTitle">Budget Management</h2>
                <p id="pageDescription">Manage and monitor club budgets.</p>
            </header>

            <!-- Create Budget -->
            <section class="content-section" id="createBudgetSection">

                <h2 id="budgetFormTitle">Create New Budget</h2>

                <form id="budgetForm">

                    <div class="form-group">
                        <label for="budgetName">Budget Name</label>
                        <input type="text" id="budgetName" required>
                    </div>

                    <div class="form-group">
                        <label for="totalAmount">Total Amount (RM)</label>
                        <input type="number" id="totalAmount"
                            min="0.01" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate">
                    </div>

                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate">
                    </div>

                    <button type="submit">Create Budget</button>

                </form>

                <p id="budgetMessage"></p>

            </section>

            <!-- Existing Budgets -->
            <section class="content-section" id="existingBudgets">

                <h2>Existing Budgets</h2>

                <table>
                    <thead>
                        <tr>
                            <th>Budget Name</th>
                            <th>Total Amount (RM)</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                        </tr>
                    </thead>

                    <tbody id="budgetRecords">
                        <tr>
                            <td colspan="4">Loading budgets...</td>
                        </tr>
                    </tbody>
                </table>

            </section>

        </main>

    </div>

</body>
</html>
