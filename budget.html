<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Management - ClubFund</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js" defer></script>
    <script src="budget.js" defer></script>
</head>
<body>

    <div class="dashboard">
        <h1>ClubFund</h1>
        <h2>Budget Management</h2>

        <a href="dashboard.html">Back to Dashboard</a>

        <hr>

        <h2>Create New Budget</h2>

        <form id="budgetForm">

            <label for="budgetName">Budget Name:</label>
            <input type="text" id="budgetName" required>

            <label for="totalAmount">Total Amount (RM):</label>
            <input type="number" id="totalAmount" min="0.01" step="0.01" required>

            <label for="startDate">Start Date:</label>
            <input type="date" id="startDate">

            <label for="endDate">End Date:</label>
            <input type="date" id="endDate">

            <button type="submit">Create Budget</button>

        </form>

        <p id="budgetMessage"></p>

        <hr>

        <h2>Existing Budgets</h2>

        <table>
            <thead>
                <tr>
                    <th>Budget Name</th>
                    <th>Total Amount (RM)</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                </tr>
            </thead>

            <tbody id="budgetRecords">
                <tr>
                    <td colspan="4">Loading budgets...</td>
                </tr>
            </tbody>
        </table>

    </div>

</body>
</html>
